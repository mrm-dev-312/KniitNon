# Stage 0 Exploration & Scope configuration
stage: 0
name: stage0.exploration
description: Initial discovery stage generating topic scope, search strings, and research boundaries.

# Prompt chain for scope definition
prompts:
  - generate_topic_scope
  - generate_search_strings
  - validate_scope_feasibility
  - refine_research_boundaries

# Metrics computation for scope evaluation  
metrics:
  topic_scope_count: 'count(artifacts, {"schema_id": "stage0.topic_scope"})'
  search_string_count: 'count(artifacts, {"schema_id": "stage0.search_string"})'
  boundary_definition_count: 'count(artifacts, {"schema_id": "stage0.boundary_definition"})'

# Gate rules: ensure adequate scope definition
gate:
  rules:
    # Must have at least one topic scope
    - expr: '{ ">=": [ {"var": "metrics.topic_scope_count"}, 1 ] }'
    # Must have sufficient search strings but not too many
    - expr: '{ ">=": [ {"var": "metrics.search_string_count"}, 3 ] }'
    - expr: '{ "<=": [ {"var": "metrics.search_string_count"}, 10 ] }'
    # Must have boundary definitions
    - expr: '{ ">=": [ {"var": "metrics.boundary_definition_count"}, 1 ] }'
  auto_pass: false
  requires_user_ack: true
