apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kniitnon
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/maxScale: "2"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      containers:
      - image: gcr.io/kniitnon/kniitnon:latest
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        - name: NEXTAUTH_URL
          value: "https://kniitnon-HASH-uc.a.run.app"
        - name: NEXTAUTH_SECRET
          value: "your-nextauth-secret-here"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
  traffic:
  - percent: 100
    latestRevision: true
